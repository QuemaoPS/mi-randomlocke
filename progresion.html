<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progresión y Logros - Pokémon Añil Tracker v2.0</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="brand">
      <span class="pokeball-icon"></span>
      <span>POKÉMON AÑIL <span style="color:var(--accent-red)">TRACKER 2.0</span></span>
    </div>
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="jugador.html?p=quemao">Quemao</a>
      <a href="jugador.html?p=zep">Zep</a>
      <a href="jugador.html?p=ferry">Ferry</a>
      <a href="progresion.html" class="active">Gimnasios & Logros</a>
    </div>
  </nav>

  <div class="container">
    <div class="grid-2">
      <!-- Medallas y Líderes -->
      <div class="card">
        <div class="card-header">
          <h3>🏅 Progresión de Gimnasios (Level Cap)</h3>
        </div>
        <div id="gyms-list"></div>
      </div>

      <!-- Logros Desbloqueables -->
      <div class="card">
        <div class="card-header">
          <h3>🏆 Logros del Randomlocke</h3>
        </div>
        <div id="achievements-list"></div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="js/default-data.js"></script>
  <script src="js/anil-sync.js"></script>
  <script>
    function toggleGym(gymId, playerId) {
      const gym = store.data.gyms.find(g => g.id === gymId);
      if (!gym) return;
      const idx = gym.completedBy.indexOf(playerId);
      if (idx > -1) {
        gym.completedBy.splice(idx, 1);
      } else {
        gym.completedBy.push(playerId);
      }
      store.saveLocal();
      renderProgresion();
    }

    function renderProgresion() {
      const gymsList = document.getElementById("gyms-list");
      const players = Object.values(store.data.players);

      gymsList.innerHTML = store.data.gyms.map(gym => {
        const anyDone = gym.completedBy.length > 0;
        const buttons = players.map(p => {
          const done = gym.completedBy.includes(p.id);
          return `<button class="btn ${done ? 'btn-success' : ''}" style="padding:4px 8px; font-size:0.78rem;" onclick="toggleGym('${gym.id}', '${p.id}')">
            ${done ? '✅' : '⬜'} ${p.name}
          </button>`;
        }).join(" ");

        return `
          <div class="gym-card ${anyDone ? 'completed' : 'pending'}">
            <div>
              <div style="font-weight:700;">${gym.name}</div>
              <div style="font-size:0.8rem; color:var(--text-secondary);">Nivel Máximo Recomendado: <strong>Nv. ${gym.levelCap}</strong></div>
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              ${buttons}
            </div>
          </div>
        `;
      }).join("");

      const achList = document.getElementById("achievements-list");
      achList.innerHTML = store.data.achievements.map(ach => {
        const unlockedBy = players.filter(p => {
          const totalPokes = p.team.length + p.box.length + p.graveyard.length;
          const badges = store.data.gyms.filter(g => g.completedBy.includes(p.id)).length;
          if (ach.id === "first_catch") return totalPokes >= 1;
          if (ach.id === "full_team") return p.team.length >= 6;
          if (ach.id === "first_badge") return badges >= 1;
          if (ach.id === "survivor") return badges >= 4 && p.lives >= 7;
          return false;
        }).map(p => p.name);

        return `
          <div class="gym-card ${unlockedBy.length ? 'completed' : 'pending'}">
            <div>
              <div style="font-weight:700;">${unlockedBy.length ? '🏆' : '🔒'} ${ach.title}</div>
              <div style="font-size:0.82rem; color:var(--text-secondary);">${ach.desc}</div>
              <div style="font-size:0.78rem; color:var(--accent-green); margin-top:4px;">
                ${unlockedBy.length ? 'Desbloqueado por: ' + unlockedBy.join(', ') : 'Aún bloqueado'}
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    renderProgresion();
  </script>
</body>
</html>
