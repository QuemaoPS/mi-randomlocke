<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Jugador - Pokémon Añil Tracker v2.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="brand">
      <span class="pokeball-icon"></span>
      <span>POKÉMON AÑIL <span style="color:var(--accent-red)">TRACKER 2.0</span></span>
    </div>
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="jugador.html?p=quemao" id="nav-quemao">Quemao</a>
      <a href="jugador.html?p=zep" id="nav-zep">Zep</a>
      <a href="jugador.html?p=ferry" id="nav-ferry">Ferry</a>
      <a href="progresion.html">Gimnasios & Logros</a>
    </div>
  </nav>

  <div class="container">
    <!-- Cabecera del Jugador -->
    <div class="card" style="margin-bottom: 1.5rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
      <div style="display:flex; align-items:center; gap:14px;">
        <img id="player-avatar" src="" onerror="this.style.display='none'" style="width:56px;height:56px;border-radius:50%;border:2px solid var(--accent-blue);">
        <div>
          <h1 id="player-name" style="font-size:1.6rem;">Entrenador</h1>
          <p style="color:var(--text-secondary); font-size:0.9rem;">Gestión de Equipo, Cajas y Registro de Capturas</p>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <div class="lives-pill" style="font-size:1.1rem;">
          ❤️ Vidas: <span id="player-lives">10</span>
        </div>
        <button class="btn" onclick="changeLives(-1)">-1 Vida</button>
        <button class="btn" onclick="changeLives(1)">+1 Vida</button>
      </div>
    </div>

    <div class="grid-2" style="grid-template-columns: 2fr 1fr; align-items:start;">
      <div>
        <!-- Equipo Activo -->
        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="card-header">
            <h3>⚔️ Equipo Activo (<span id="team-count">0</span>/6)</h3>
          </div>
          <div class="team-grid" id="team-grid"></div>
        </div>

        <!-- Caja de Almacenamiento -->
        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="card-header">
            <h3>📦 Caja del PC (<span id="box-count">0</span>)</h3>
          </div>
          <div class="team-grid" id="box-grid"></div>
        </div>

        <!-- Cementerio -->
        <div class="card">
          <div class="card-header">
            <h3 style="color:var(--accent-red);">💀 Cementerio / Caídos (<span id="dead-count">0</span>)</h3>
          </div>
          <div class="team-grid" id="dead-grid"></div>
        </div>
      </div>

      <!-- Formulario Añadir Captura -->
      <div class="card" style="position:sticky; top:90px;">
        <div class="card-header">
          <h3>➕ Registrar Captura</h3>
        </div>
        <form onsubmit="addPokemon(event)">
          <div class="form-group">
            <label>Especie (en inglés para sprite, ej: pikachu, charizard)</label>
            <input type="text" id="poke-species" required placeholder="Ej: gengar">
          </div>
          <div class="form-group">
            <label>Mote / Apodo</label>
            <input type="text" id="poke-nickname" placeholder="Ej: Sombra">
          </div>
          <div class="form-group">
            <label>Nivel</label>
            <input type="number" id="poke-level" value="5" min="1" max="100">
          </div>
          <div class="form-group">
            <label>Ruta de Captura</label>
            <input type="text" id="poke-route" placeholder="Ej: Ruta 1 / Bosque Verde">
          </div>
          <div class="form-group">
            <label>Habilidad / Objeto</label>
            <input type="text" id="poke-ability" placeholder="Ej: Levitación / Restos">
          </div>
          <div class="form-group">
            <label>Destino</label>
            <select id="poke-dest">
              <option value="team">Equipo Activo (si hay hueco)</option>
              <option value="box">Caja del PC</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Guardar Pokémon</button>
        </form>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="default-data.js"></script>
  <script src="anil-sync.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const playerId = params.get("p") || "quemao";
    const activeNav = document.getElementById("nav-" + playerId);
    if (activeNav) activeNav.classList.add("active");

    function getPlayer() {
      return store.data.players[playerId] || store.data.players.quemao;
    }

    function changeLives(delta) {
      const p = getPlayer();
      p.lives = Math.max(0, p.lives + delta);
      store.saveLocal();
      renderPlayer();
    }

    function addPokemon(e) {
      e.preventDefault();
      const p = getPlayer();
      const newPoke = {
        id: Date.now().toString(),
        species: document.getElementById("poke-species").value.trim(),
        nickname: document.getElementById("poke-nickname").value.trim(),
        level: parseInt(document.getElementById("poke-level").value) || 5,
        route: document.getElementById("poke-route").value.trim(),
        ability: document.getElementById("poke-ability").value.trim(),
        deathCause: ""
      };
      const dest = document.getElementById("poke-dest").value;
      if (dest === "team" && p.team.length < 6) {
        p.team.push(newPoke);
      } else {
        p.box.push(newPoke);
      }
      store.saveLocal();
      e.target.reset();
      renderPlayer();
    }

    function movePokemon(fromList, toList, index) {
      const p = getPlayer();
      if (toList === "team" && p.team.length >= 6) {
        alert("El equipo ya tiene 6 Pokémon. Mueve uno a la caja primero.");
        return;
      }
      if (fromList === "graveyard") {
        if (!confirm("¿Seguro que deseas revivir este Pokémon del cementerio?")) return;
      }
      const [poke] = p[fromList].splice(index, 1);
      if (toList === "graveyard") {
        const cause = prompt("¿Cuál fue la causa de la muerte? (Opcional)", "Combate crítico");
        poke.deathCause = cause || "Caído en combate";
        if (confirm("¿Restar 1 vida al contador del jugador automáticamente?")) {
          p.lives = Math.max(0, p.lives - 1);
        }
      }
      p[toList].push(poke);
      store.saveLocal();
      renderPlayer();
    }

    function levelUp(list, index) {
      const p = getPlayer();
      p[list][index].level = (p[list][index].level || 1) + 1;
      store.saveLocal();
      renderPlayer();
    }

    function deletePokemon(list, index) {
      if (!confirm("¿Eliminar permanentemente este registro?")) return;
      const p = getPlayer();
      p[list].splice(index, 1);
      store.saveLocal();
      renderPlayer();
    }

    function createPokeCard(poke, listName, index) {
      const isDead = listName === "graveyard";
      return `
        <div class="poke-card ${isDead ? 'dead' : ''}">
          <img class="poke-sprite" src="${store.getSpriteUrl(poke.species)}" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png'">
          <div class="poke-name">${poke.nickname || poke.species}</div>
          <div class="poke-species">${poke.species} · Nv. ${poke.level}</div>
          <div class="poke-meta">📍 ${poke.route || 'Desconocida'}</div>
          ${poke.ability ? `<div class="poke-meta">✨ ${poke.ability}</div>` : ''}
          ${isDead ? `<div class="poke-meta" style="color:var(--accent-red)">💀 ${poke.deathCause}</div>` : ''}
          <div class="poke-actions">
            ${!isDead ? `<button onclick="levelUp('${listName}', ${index})">+1 Nv</button>` : ''}
            ${listName !== 'team' ? `<button onclick="movePokemon('${listName}', 'team', ${index})">Al Equipo</button>` : ''}
            ${listName !== 'box' ? `<button onclick="movePokemon('${listName}', 'box', ${index})">A Caja</button>` : ''}
            ${listName !== 'graveyard' ? `<button style="color:var(--accent-red)" onclick="movePokemon('${listName}', 'graveyard', ${index})">💀</button>` : ''}
            <button onclick="deletePokemon('${listName}', ${index})">🗑️</button>
          </div>
        </div>
      `;
    }

    function renderPlayer() {
      const p = getPlayer();
      document.getElementById("player-name").textContent = p.name;
      document.getElementById("player-avatar").src = p.avatar;
      document.getElementById("player-lives").textContent = p.lives;

      document.getElementById("team-count").textContent = p.team.length;
      document.getElementById("box-count").textContent = p.box.length;
      document.getElementById("dead-count").textContent = p.graveyard.length;

      document.getElementById("team-grid").innerHTML = p.team.length
        ? p.team.map((pk, i) => createPokeCard(pk, "team", i)).join("")
        : `<p style="color:var(--text-secondary); font-size:0.85rem;">Equipo vacío.</p>`;

      document.getElementById("box-grid").innerHTML = p.box.length
        ? p.box.map((pk, i) => createPokeCard(pk, "box", i)).join("")
        : `<p style="color:var(--text-secondary); font-size:0.85rem;">No hay Pokémon en la caja.</p>`;

      document.getElementById("dead-grid").innerHTML = p.graveyard.length
        ? p.graveyard.map((pk, i) => createPokeCard(pk, "graveyard", i)).join("")
        : `<p style="color:var(--text-secondary); font-size:0.85rem;">Ninguna baja registrada aún. ¡Sigue así!</p>`;
    }

    renderPlayer();
  </script>
</body>
</html>
