<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Añil Randomlocke Tracker v2.0</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="brand">
      <span class="pokeball-icon"></span>
      <span>POKÉMON AÑIL <span style="color:var(--accent-red)">TRACKER 2.0</span></span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="active">Inicio</a>
      <a href="jugador.html?p=quemao">Quemao</a>
      <a href="jugador.html?p=zep">Zep</a>
      <a href="jugador.html?p=ferry">Ferry</a>
      <a href="progresion.html">Gimnasios & Logros</a>
    </div>
  </nav>

  <div class="container">
    <!-- Barra de Sincronización y Backup -->
    <div class="card" style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h2 style="font-size: 1.15rem;">Estado de la Partida</h2>
        <p style="color: var(--text-secondary); font-size: 0.85rem;" id="last-sync-text">Última actualización local: cargando...</p>
      </div>
      <div style="display: flex; gap: 0.6rem; flex-wrap: wrap;">
        <button class="btn btn-primary" onclick="promptGitHubSync()">🔄 Sincronizar GitHub</button>
        <button class="btn" onclick="store.exportJSON()">⬇️ Exportar JSON</button>
        <label class="btn" style="cursor:pointer;">
          ⬆️ Importar JSON
          <input type="file" accept=".json" style="display:none" onchange="handleImport(event)">
        </label>
        <button class="btn btn-danger" onclick="if(store.restoreBackup()) renderDashboard()">⏪ Deshacer Cambio</button>
      </div>
    </div>

    <!-- Tarjetas de Jugadores -->
    <div class="grid-3" id="players-overview"></div>

    <!-- Resumen de Estadísticas -->
    <div class="card" style="margin-top: 1.5rem;">
      <div class="card-header">
        <h3>📊 Comparativa Global del Locke</h3>
      </div>
      <div class="grid-3" id="global-stats"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="js/default-data.js"></script>
  <script src="js/anil-sync.js"></script>
  <script>
    function renderDashboard() {
      const container = document.getElementById("players-overview");
      const statsContainer = document.getElementById("global-stats");
      const lastSync = document.getElementById("last-sync-text");
      lastSync.textContent = "Última actualización: " + new Date(store.data.lastUpdated).toLocaleString();

      container.innerHTML = "";
      let totalLives = 0, totalDeaths = 0, totalCatches = 0;

      Object.values(store.data.players).forEach(player => {
        totalLives += player.lives;
        totalDeaths += player.graveyard.length;
        totalCatches += (player.team.length + player.box.length + player.graveyard.length);

        const badgesCount = store.data.gyms.filter(g => g.completedBy.includes(player.id)).length;

        const teamHTML = player.team.length > 0
          ? player.team.map(p => `
              <div style="text-align:center; background:#0d1117; padding:6px; border-radius:8px; border:1px solid var(--border-color);">
                <img src="${store.getSpriteUrl(p.species)}" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png'" style="width:44px;height:44px;object-fit:contain;">
                <div style="font-size:0.75rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.nickname || p.species}</div>
                <div style="font-size:0.68rem; color:var(--text-secondary);">Nv.${p.level || '?'}</div>
              </div>
            `).join("")
          : `<p style="color:var(--text-secondary); font-size:0.85rem; grid-column: 1 / -1;">Sin Pokémon en el equipo activo.</p>`;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-header">
            <div style="display:flex; align-items:center; gap:10px;">
              <img src="${player.avatar}" onerror="this.style.display='none'" style="width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--accent-blue);">
              <div>
                <h3 style="font-size:1.2rem;">${player.name}</h3>
                <span style="font-size:0.8rem; color:var(--text-secondary);">🏅 ${badgesCount} Medallas · 💀 ${player.graveyard.length} Bajas</span>
              </div>
            </div>
            <div class="lives-pill">❤️ ${player.lives}</div>
          </div>
          <div style="margin-bottom: 1rem;">
            <div style="font-size:0.8rem; color:var(--text-secondary); margin-bottom:0.5rem; font-weight:600;">EQUIPO ACTIVO (${player.team.length}/6)</div>
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px;">
              ${teamHTML}
            </div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1rem; padding-top:0.75rem; border-top:1px solid var(--border-color);">
            <span style="font-size:0.8rem; color:var(--text-secondary);">📦 En Caja: ${player.box.length}</span>
            <a href="jugador.html?p=${player.id}" class="btn btn-primary">Gestionar Ficha →</a>
          </div>
        `;
        container.appendChild(card);
      });

      statsContainer.innerHTML = `
        <div style="background:#0d1117; padding:1rem; border-radius:10px; border:1px solid var(--border-color); text-align:center;">
          <div style="font-size:1.8rem; font-weight:800; color:var(--accent-red);">${totalLives}</div>
          <div style="font-size:0.85rem; color:var(--text-secondary);">Vidas Totales Restantes</div>
        </div>
        <div style="background:#0d1117; padding:1rem; border-radius:10px; border:1px solid var(--border-color); text-align:center;">
          <div style="font-size:1.8rem; font-weight:800; color:var(--accent-blue);">${totalCatches}</div>
          <div style="font-size:0.85rem; color:var(--text-secondary);">Capturas Registradas</div>
        </div>
        <div style="background:#0d1117; padding:1rem; border-radius:10px; border:1px solid var(--border-color); text-align:center;">
          <div style="font-size:1.8rem; font-weight:800; color:var(--text-primary);">${totalDeaths}</div>
          <div style="font-size:0.85rem; color:var(--text-secondary);">Caídos en Combate</div>
        </div>
      `;
    }

    async function promptGitHubSync() {
      const currentUrl = store.data.config.githubRawUrl || "";
      const url = prompt("Introduce la URL Raw de tu JSON en GitHub:", currentUrl);
      if (url !== null && url.trim() !== "") {
        store.data.config.githubRawUrl = url.trim();
        store.saveLocal();
        const ok = await store.syncFromGitHub(url.trim());
        if (ok) renderDashboard();
      }
    }

    function handleImport(e) {
      const file = e.target.files[0];
      if (file) store.importJSON(file, renderDashboard);
    }

    renderDashboard();
  </script>
</body>
</html>
